services:
  osintx-web:
    build: .
    image: osintx-web:latest
    container_name: osintx-web
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      OSINTX_HOST: 0.0.0.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
